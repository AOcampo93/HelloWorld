<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 0 16px;
      background: #f5f7fa;
      color: #1f2933;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.5rem, 10vw, 5rem);
      color: #0b5cad;
    }
    p {
      margin: 0;
      font-size: 1.25rem;
      color: #52606d;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #e5e7eb; }
      h1 { color: #60a5fa; }
      p { color: #9ca3af; }
    }
  </style>
</head>
<body>
  <main>
    <!-- hello_world.js fills in these two elements. -->
    <h1 id="message"></h1>
    <p id="greeting"></p>
  </main>

  <!-- Loaded at the end of the body so the elements above already exist. -->
  <script src="hello_world.js"></script>
</body>
</html>
